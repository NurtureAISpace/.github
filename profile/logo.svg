<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#182642" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Mars Planet Gradient -->
    <linearGradient id="marsSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="45%" stop-color="#e64a19" />
      <stop offset="85%" stop-color="#b71c1c" />
      <stop offset="100%" stop-color="#4a0e0e" />
    </linearGradient>

    <!-- Bio-Leaf & Nutrition Gradient -->
    <linearGradient id="bioGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Atmosphere Ring Glow -->
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sunHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="halo" />
      <feComposite in="SourceGraphic" in2="halo" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="500" height="500" rx="40" fill="url(#spaceGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="38" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Background Hexagonal Life Support Lattice (Subtle) -->
  <g stroke="#1e2e48" stroke-width="1.2" opacity="0.35" fill="none">
    <polygon points="250,50 300,78 300,136 250,164 200,136 200,78" />
    <polygon points="350,107 400,135 400,193 350,221 300,193 300,135" />
    <polygon points="150,107 200,135 200,193 150,221 100,193 100,135" />
    <polygon points="400,222 450,250 450,308 400,336 350,308 350,250" />
    <polygon points="100,222 150,250 150,308 100,336 50,308 50,250" />
    <polygon points="250,336 300,364 300,422 250,450 200,422 200,364" />
  </g>

  <!-- Central Mars Sphere with Atmosphere -->
  <g transform="translate(250, 220)">
    <!-- Atmosphere Outer Ring -->
    <circle r="125" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 6" />
    <circle r="118" fill="none" stroke="url(#orbitRing)" stroke-width="3" filter="url(#glowEffect)" opacity="0.85" />

    <!-- Mars Planet Body -->
    <circle r="105" fill="url(#marsSurface)" />

    <!-- Craters & Surface Topology -->
    <path d="M-60,-30 A 24 16 0 0 0 -20,-20 A 24 16 0 0 1 -60,-30" fill="#991b1b" opacity="0.45" />
    <path d="M10,25 A 35 20 0 0 0 65,40 A 35 20 0 0 1 10,25" fill="#7f1d1d" opacity="0.55" />
    <path d="M-40,40 A 18 12 0 0 0 -15,48 A 18 12 0 0 1 -40,40" fill="#991b1b" opacity="0.4" />
    <circle cx="45" cy="-40" r="14" fill="#991b1b" opacity="0.4" />
    <circle cx="48" cy="-42" r="9" fill="#7f1d1d" opacity="0.5" />

    <!-- Planetary Shadow / Day-Night Terminator Line -->
    <path d="M0,-105 A 105 105 0 0 1 0,105 A 105 105 0 0 0 0,-105" fill="#020617" opacity="0.52" />

    <!-- Orbital Trajectory Arc -->
    <path d="M-140,45 C-120,-60 60,-130 150,-40" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glowEffect)" />
    <!-- Orbiting Life Support Capsule/Satellite -->
    <circle cx="150" cy="-40" r="4.5" fill="#38bdf8" filter="url(#glowEffect)" />
    <circle cx="150" cy="-40" r="2" fill="#ffffff" />

    <!-- Bio-regenerative Seedling / Sprout (Life on Mars Symbol) -->
    <!-- Left Leaf -->
    <path d="M0,50 C-40,15 -45,-30 0,-50 C-10,-10 -5,25 0,50 Z" fill="url(#bioGlow)" filter="url(#glowEffect)" />
    <!-- Right Leaf -->
    <path d="M0,50 C40,25 45,-15 15,-40 C10,-10 5,20 0,50 Z" fill="url(#bioGlow)" opacity="0.9" />
    <!-- Stem / Central Vein -->
    <path d="M0,50 Q-3,10 0,-50" fill="none" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round" />
    <!-- Nutritional Energy Sparkles -->
    <circle cx="0" cy="-55" r="4" fill="#fbbf24" filter="url(#sunHalo)" />
    <circle cx="-25" cy="-20" r="2.5" fill="#34d399" />
    <circle cx="28" cy="-5" r="2.5" fill="#34d399" />
  </g>

  <!-- Typography Block -->
  <text x="250" y="390" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#ffffff">
    MARS FOOD INTELLIGENCE
  </text>

  <text x="250" y="420" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#f97316">
    SOL-450 MVP • AUTONOMOUS NUTRITION SYSTEM
  </text>

  <text x="250" y="445" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" letter-spacing="1.5" fill="#64748b">
    NASA INTERNATIONAL SPACE APPS CHALLENGE GANJA 2026
  </text>
</svg>
